<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#491c57"><title>{{wordmark}} {{partner}}｜{{tagline}}</title>
<style>
:root{color-scheme:light;--purple:#491c57;--ink:#191421;--muted:#716a7c;--line:#e3dce8;--paper:#f7f5f9}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(1280px,100% - 64px);margin:auto;padding:32px 0 44px}a{color:inherit}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 0 24px;border-bottom:1px solid var(--line)}.brand{font-size:21px;letter-spacing:-.7px;font-weight:800;color:var(--purple);text-decoration:none}.brand span{font-size:15px;letter-spacing:1px;margin-left:10px}.version{font-size:12px;letter-spacing:.1em;color:var(--muted)}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:30px 0 24px}h1{font-size:clamp(24px,3.1vw,40px);letter-spacing:-1.1px;margin:0 0 11px;line-height:1.3;font-weight:700}.specs{color:var(--muted);font-size:13px;margin:0;line-height:1.7}.downloads{display:flex;gap:10px;flex-shrink:0}.downloads a{font-size:13px;text-decoration:none;border:1px solid #d3c6dc;border-radius:8px;padding:12px 17px;white-space:nowrap}.downloads .primary{background:var(--purple);border-color:var(--purple);color:white}.player{background:#03050a;border-radius:12px;overflow:hidden;box-shadow:0 18px 55px #341c4c16}video{display:block;width:100%;aspect-ratio:16/9;background:#03050a;object-fit:contain}.navigation-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:28px 0 14px}h2{font-size:15px;font-weight:600;margin:0}#current{font-size:12px;color:var(--muted)}.chapters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.chapter{font:inherit;text-align:left;cursor:pointer;border:1px solid var(--line);background:#ffffff7d;border-radius:8px;padding:13px 14px;color:#554b60;display:flex;align-items:center;gap:12px;min-height:48px}.chapter time{color:#8e819b;font-family:ui-monospace,monospace;font-size:12px;font-variant-numeric:tabular-nums}.chapter span{font-size:13px}.chapter:hover{background:#eee8f3;border-color:#c7b5d4}.chapter[aria-current="true"]{color:var(--purple);border-color:#b59ac7;background:#ece2f2}.chapter[aria-current="true"] time{color:var(--purple)}a:focus-visible,button:focus-visible,video:focus-visible{outline:3px solid #315dff;outline-offset:4px}footer{margin-top:27px;display:flex;justify-content:space-between;gap:20px;line-height:1.8;color:var(--muted);font-size:12px}footer p{margin:0}#status{margin:12px 0 0;color:#7a253c;font-size:13px}#status:empty{display:none}@media(max-width:900px){.heading{align-items:flex-start;flex-direction:column;gap:17px}.chapters{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){main{width:calc(100% - 28px);padding-top:20px}header{padding-bottom:17px}.heading{margin:22px 0 18px}h1{font-size:26px;letter-spacing:-.6px}.downloads a{padding:10px 14px}.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}.chapter{padding:11px 9px;gap:8px}.chapter span{font-size:12px}.chapter time{font-size:11px}.navigation-head{margin-top:22px}footer{flex-direction:column;gap:4px}.version{font-size:10px}.brand{font-size:18px}.brand span{font-size:13px}.player{border-radius:8px}}
</style>
</head>
<body><main>
<header><a class="brand" href="./index.html">{{wordmark}} <span>{{partner}}</span></a><span class="version">BRAND FILM / 公开示例</span></header>
<div class="heading"><div><h1>{{tagline}}</h1><p class="specs">{{duration}} 秒 · 1920 × 1080 · 30 fps · 48 kHz 立体声</p></div><div class="downloads"><a class="primary" href="./output/film.mp4" download>下载成片</a></div></div>
<div class="player"><video id="film" controls playsinline preload="metadata" poster="./previews/final-encoded/02-3.4.png" aria-label="{{wordmark}} 品牌宣传片"><source src="./output/film.mp4" type="video/mp4">浏览器无法播放此视频，请使用上方“下载成片”。</video></div>
<p id="status" role="status" aria-live="polite"></p>
<section aria-labelledby="chapter-heading"><div class="navigation-head"><h2 id="chapter-heading">分镜导航</h2><output id="current">01 / 品牌开场</output></div><div class="chapters" id="chapters"></div></section>
<footer><p>点击分镜即可跳转播放。</p><p>HTML 播放页 · 展示已渲染成片</p></footer>
</main>
<script>
const chapters={{chapters}};
const film=document.querySelector('#film'),list=document.querySelector('#chapters'),status=document.querySelector('#status'),current=document.querySelector('#current');
const format=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(1).padStart(4,'0')}`;
const buttons=chapters.map(([title,time],i)=>{const button=document.createElement('button');button.type='button';button.className='chapter';button.dataset.chapter=i;button.setAttribute('aria-label',`${title}，跳转到 ${format(time)}`);const clock=document.createElement('time');clock.textContent=format(time);const label=document.createElement('span');label.textContent=title;button.append(clock,label);button.addEventListener('click',async()=>{status.textContent='';try{if(film.readyState<1)await new Promise((resolve,reject)=>{film.addEventListener('loadedmetadata',resolve,{once:true});film.addEventListener('error',reject,{once:true})});film.currentTime=time;await film.play()}catch(error){if(error?.name!=='AbortError')status.textContent='已选择该分镜，请点击播放器中的播放按钮。'}update()});list.append(button);return button});
function update(){let active=0;for(let i=1;i<chapters.length;i++){if(film.currentTime>=chapters[i][1]-.02)active=i;else break}buttons.forEach((b,i)=>b.setAttribute('aria-current',String(i===active)));current.textContent=`${String(active+1).padStart(2,'0')} / ${chapters[active][0]}`}
film.addEventListener('playing',()=>{status.textContent=''});film.addEventListener('timeupdate',update);film.addEventListener('seeked',update);film.addEventListener('error',()=>{status.textContent='视频未能加载，请确认 HTML 与 output、previews 文件夹保留原来的位置。'});update();
</script></body></html>
